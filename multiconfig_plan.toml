## Streamlined Multi-Config Design

### Core Principle
**File-first configuration** - All multi-config setup happens in `cmdorc-tui.toml`. The TUI just loads and displays what's defined there.

### What We Build (MVP)

#### 1. **cmdorc-tui.toml Support**
```toml
# cmdorc-tui.toml
[[config]]
name = "Development"
path = "./config.toml"
includes = ["./build.toml", "./test.toml"]

[[config]]
name = "Build Only"
path = "./build.toml"

[[config]]
name = "Testing"
path = "./test.toml"

[settings]
default = "Development"
```

#### 2. **Config Switcher UI**
```
┌─────────────────────────────────────────────┐
│ Active: Development [Switch ▼]             │
├─────────────────────────────────────────────┤
│ ━━━━ config.toml ━━━━━━━━━━━━━━━━━━━━━━━━━ │
│ [1] ○ ▶️ Watch                              │
│                                              │
│ ━━━━ build.toml ━━━━━━━━━━━━━━━━━━━━━━━━━━ │
│ [2] ○ ▶️ Build Dev                          │
│ [3] ○ ▶️ Build Prod                         │
│                                              │
│ ━━━━ test.toml ━━━━━━━━━━━━━━━━━━━━━━━━━━━ │
│ [4] ○ ▶️ Unit Tests                         │
│ [5] ○ ▶️ Integration Tests                  │
└─────────────────────────────────────────────┘
```

Quick switch dropdown:
```
┌─────────────────────────────────────┐
│ ● Development (5 commands)          │
│ ○ Build Only (2 commands)           │
│ ○ Testing (3 commands)              │
└─────────────────────────────────────┘
```

#### 3. **Startup Flow**

```
Check for cmdorc-tui.toml
├─ Exists?
│  ├─ Valid? → Load it
│  │  ├─ Has default? → Load default config
│  │  ├─ Has saved active in settings? → Load that
│  │  └─ Multiple configs, no default → Load first one
│  └─ Invalid? → Show error, offer to recreate
│
└─ Doesn't exist?
   ├─ Found config.toml in cwd? → Load it (backward compat)
   └─ No config.toml? → Offer to create starter
      └─ "Create config.toml or cmdorc-tui.toml?"
```

#### 4. **Initial Setup Prompt**

When no configs found:
```
┌─────────────────────────────────────────────┐
│  Welcome to textual-cmdorc!                 │
├─────────────────────────────────────────────┤
│  No configuration found.                    │
│                                              │
│  What would you like to create?             │
│                                              │
│  [1] config.toml                            │
│      Simple single-file setup               │
│                                              │
│  [2] cmdorc-tui.toml                           │
│      Multi-config setup (advanced)          │
│                                              │
│  [3] Exit                                   │
│                                              │
│                    [1] [2] [3]              │
└─────────────────────────────────────────────┘
```

**Option 1: Creates `config.toml`**
```toml
# Starter config.toml
[[command]]
name = "Hello"
command = "echo 'Hello from cmdorc!'"

[[command]]
name = "Date"
command = "date"
```

**Option 2: Creates `cmdorc-tui.toml` + `config.toml`**
```toml
# cmdorc-tui.toml
[[config]]
name = "Main Config"
path = "./config.toml"

[settings]
default = "Main Config"
```

Plus the same starter `config.toml`

### What We DON'T Build (MVP)

❌ Config discovery/scanning UI  
❌ Directory tree picker  
❌ File watcher for adding configs  
❌ In-TUI config editor  
❌ Config validation modal  
❌ "Add config" buttons  

### User Workflow

#### Scenario 1: New User (Single Config)
```bash
$ cmdorc-tui
> No config found. Create config.toml? [Y/n]
> Created config.toml with example commands.
# TUI opens with config.toml loaded
```

#### Scenario 2: New User (Multi-Config)
```bash
$ cmdorc-tui
> No config found. Create:
>   [1] config.toml (simple)
>   [2] cmdorc-tui.toml (advanced)
> Choice: 2
> Created cmdorc-tui.toml and config.toml
# TUI opens with Main Config loaded
```

#### Scenario 3: User Wants Multiple Configs
```bash
# User manually creates files
$ touch build.toml test.toml deploy.toml

# User edits cmdorc-tui.toml
$ nano cmdorc-tui.toml

[[config]]
name = "Development"
path = "./config.toml"
includes = ["./build.toml", "./test.toml"]

[[config]]
name = "Deployment"
path = "./deploy.toml"

[settings]
default = "Development"

# Start TUI
$ cmdorc-tui
# TUI opens with Development config loaded (default)
# User can switch to Deployment via dropdown
```

#### Scenario 4: Config Error Handling
```bash
$ cmdorc-tui
> Error loading cmdorc-tui.toml:
>   - build.toml not found (referenced in "Development")
> 
> Edit cmdorc-tui.toml to fix, or press [R] to recreate starter.
```

### CLI Enhancements

```bash
# Use specific config from cmdorc-tui.toml (by name)
cmdorc-tui --config "Development"

# Show available configs (from cmdorc-tui.toml)
cmdorc-tui --list-configs
# Output:
# Available configs (from cmdorc-tui.toml):
#   - Development (config.toml + build.toml + test.toml) [default]
#   - Build Only (build.toml)
#   - Testing (test.toml)

# Validate cmdorc-tui.toml
cmdorc-tui --validate
# Output:
# ✓ cmdorc-tui.toml is valid
# ✓ Development
#   - config.toml ✓
#   - build.toml ✓
#   - test.toml ✓
# ✓ Build Only
#   - build.toml ✓

# Create starter cmdorc-tui.toml (with any found .toml files)
cmdorc-tui --init-configs
# Output:
# Found 3 .toml files:
#   - config.toml
#   - build.toml
#   - test.toml
# 
# Created cmdorc-tui.toml with:
#   - "All Configs" (includes all 3)
#   - "Main Config" (config.toml only)
#   - "Build Only" (build.toml only)
#   - "Testing" (test.toml only)
```

### Settings JSON (Minimal)

```json
{
  "version": "1.0",
  "active_config_name": "Development",
  "configs_toml_path": "./cmdorc-tui.toml"
}
```

Just tracks which config is currently active. Everything else is in `cmdorc-tui.toml`.

### Documentation Strategy

**README.md section:**
```markdown
## Using Multiple Configs

textual-cmdorc supports multiple configurations via `cmdorc-tui.toml`:

1. Create individual config files for different purposes:
   - `build.toml` - Build commands
   - `test.toml` - Test commands
   - `deploy.toml` - Deployment commands

2. Create `cmdorc-tui.toml` to define how they're used:

```toml
[[config]]
name = "Development"
includes = ["./build.toml", "./test.toml"]

[[config]]
name = "CI Pipeline"
includes = ["./build.toml", "./test.toml", "./coverage.toml"]

[[config]]
name = "Production Deploy"
path = "./deploy.toml"

[settings]
default = "Development"
```

3. Switch between configs in the TUI using the dropdown or `Ctrl+K`

See [examples/multi-config/](examples/multi-config/) for complete examples.
```

